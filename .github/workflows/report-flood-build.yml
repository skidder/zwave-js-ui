name: Report-flood image build

# Fork-only workflow: builds and pushes the report-flood-ui branch image to
# the fork's GHCR namespace. Not intended for upstream contribution.
on:
  push:
    branches:
      - report-flood-ui
  workflow_dispatch:

jobs:
  build-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/skidder/zwave-js-ui:report-flood
            ghcr.io/skidder/zwave-js-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
