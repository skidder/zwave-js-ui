name: Report-flood image build

# Fork-only workflow: builds the report-flood-ui branch against the patched
# driver (skidder/zwave-js report-flood-monitor) and server
# (skidder/zwave-js-server report-flood-forwarding) and pushes the image to
# the fork's GHCR and Docker Hub. Not intended for upstream contribution.
on:
  push:
    branches:
      - report-flood-ui
  workflow_dispatch:

env:
  DRIVER_REF: report-flood-monitor
  SERVER_REF: report-flood-forwarding

jobs:
  build-deps:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.shas.outputs.key }}
    steps:
      - name: Resolve fork branch SHAs
        id: shas
        run: |
          DRIVER_SHA=$(git ls-remote https://github.com/skidder/zwave-js.git refs/heads/$DRIVER_REF | cut -f1)
          SERVER_SHA=$(git ls-remote https://github.com/skidder/zwave-js-server.git refs/heads/$SERVER_REF | cut -f1)
          echo "driver=$DRIVER_SHA" >> "$GITHUB_OUTPUT"
          echo "server=$SERVER_SHA" >> "$GITHUB_OUTPUT"
          echo "key=$DRIVER_SHA-$SERVER_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: vendor-cache
        with:
          path: vendor
          key: vendor-${{ steps.shas.outputs.key }}

      - name: Checkout patched driver
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: skidder/zwave-js
          ref: ${{ env.DRIVER_REF }}
          path: zwave-js

      - name: Build and pack zwave-js packages
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        working-directory: zwave-js
        run: |
          corepack enable
          corepack yarn install --immutable
          corepack yarn workspace @zwave-js/eslint-plugin run build
          corepack yarn build
          mkdir -p "$GITHUB_WORKSPACE/vendor-src"
          corepack yarn workspaces foreach -A pack --out "$GITHUB_WORKSPACE/vendor-src/%s.tgz"

      - name: Checkout patched server
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: skidder/zwave-js-server
          ref: ${{ env.SERVER_REF }}
          path: zwave-js-server

      - name: Build and pack the server
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        working-directory: zwave-js-server
        run: |
          corepack enable
          corepack yarn install --immutable
          corepack yarn build
          corepack yarn pack --out "$GITHUB_WORKSPACE/vendor-src/zwave-js-server.tgz"
          ls -la "$GITHUB_WORKSPACE/vendor-src"

      - name: Normalize tarballs into vendor/<name> dirs
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor
          for tgz in vendor-src/*.tgz; do
            [ -e "$tgz" ] || continue
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp" --strip-components=1
            name=$(node -p "require('$tmp/package.json').name" | tr '/' '_')
            mv "$tmp" "vendor/$name"
            echo "vendor/$name <- $(basename $tgz)"
          done
          find vendor -maxdepth 2 -name package.json

      - name: Upload vendor packages
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ steps.shas.outputs.key }}
          path: vendor

  build-image:
    needs: build-deps
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: vendor-*
          path: vendor
          merge-multiple: true

      - name: Point package.json at the patched packages
        run: node scripts/apply-patched-deps.mjs && grep -c '"@zwave-js/server"' package.json

      - name: Install dependencies (npm)
        run: |
          npm install --no-package-lock
          npx tsc --version

      - name: Build server bundle and assert schema 53
        run: |
          npm run build:server
          grep -E "maxSchemaVersion = 53|maxSchemaVersion.*53" api/build/lib/const.js || {
            echo "schema 53 marker missing"; exit 1; }

      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/skidder/zwave-js-ui:report-flood
            ghcr.io/skidder/zwave-js-ui:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/zwave-js-ui:report-flood
            ${{ secrets.DOCKER_USERNAME }}/zwave-js-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
